<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The weesungshin Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #030303; --text: #ffffff; --accent: #d4af37; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Playfair Display', serif; overflow-x: hidden; cursor: crosshair; }

        /* 배경 미세 노이즈 및 스포트라이트 */
        .grain { position: fixed; inset: 0; background: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity: 0.03; pointer-events: none; z-index: 100; }
        .spotlight { position: fixed; inset: 0; pointer-events: none; z-index: 10; background: radial-gradient(circle 700px at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.035), transparent 85%); }

        /* 보안 게이트 (Gate) */
        #gate { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1); }
        .enter-btn { font-family: 'Cinzel', serif; font-size: 1.1rem; letter-spacing: 12px; color: var(--text); border: 1px solid rgba(255,255,255,0.15); padding: 25px 80px; cursor: pointer; background: transparent; transition: all 0.6s ease; }
        .enter-btn:hover { background: var(--text); color: var(--bg); letter-spacing: 16px; box-shadow: 0 0 50px rgba(255,255,255,0.1); }

        /* 헤더 및 철학 문구 */
        #archive-content { display: none; opacity: 0; transition: opacity 2.5s ease; }
        header { height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 10vw; }
        .main-title { font-family: 'Cinzel', serif; font-size: clamp(2.5rem, 7vw, 5rem); letter-spacing: 18px; margin-bottom: 3rem; text-transform: uppercase; }
        .philosophy-box { max-width: 900px; line-height: 2.4; font-size: 1.2rem; color: #999; word-break: keep-all; }
        .philosophy-box b { color: var(--text); font-weight: 400; }
        .accent-line { color: var(--accent); font-family: 'Cinzel'; font-size: 0.8rem; letter-spacing: 5px; display: block; margin-top: 2.5rem; }

        /* 3D 액자 갤러리 시스템 (핵심) */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(550px, 1fr)); gap: 18rem; padding: 0 10vw 40vh; }
        .canvas-container { position: relative; perspective: 2000px; }
        .canvas-wrap {
            position: relative; width: 100%; aspect-ratio: 4/5;
            transform-style: preserve-3d; transition: transform 0.15s ease-out;
            box-shadow: 0 80px 160px rgba(0,0,0,0.9);
            border-left: 35px solid #000; border-bottom: 10px solid #050505;
        }
        .canvas-image-layer { width: 100%; height: 100%; position: relative; overflow: hidden; background: #0a0a0a; }
        .main-img { width: 100%; height: 100%; object-fit: cover; transition: filter 0.3s; transform: scale(1.05); }
        
        /* 캔버스 텍스처 오버레이 */
        .texture-layer { position: absolute; inset: 0; pointer-events: none; background-image: url('https://www.transparenttextures.com/patterns/canvas-orange.png'); mix-blend-mode: overlay; opacity: 0.5; transition: opacity 0.3s; }

        /* SOLD OUT 압인 효과 */
        .curated-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 1s; backdrop-filter: grayscale(0.8) blur(2px); }
        .is-sold .curated-overlay { opacity: 1; }
        .pressed-seal { font-family: 'Cinzel', serif; font-size: 1.6rem; letter-spacing: 12px; color: rgba(255, 255, 255, 0.08); text-shadow: -1px -1px 1px rgba(255,255,255,0.2), 1px 1px 1px #000; text-align: center; }

        /* 컨트롤 패널 */
        .control-panel { margin-top: 4rem; padding: 40px; background: rgba(10, 10, 12, 0.95); border: 1px solid #1a1a1c; }
        .control-panel label { font-size: 0.75rem; letter-spacing: 4px; color: #444; display: flex; justify-content: space-between; margin-bottom: 15px; text-transform: uppercase; }
        .control-panel input { width: 100%; appearance: none; background: #222; height: 1px; cursor: pointer; margin-bottom: 30px; outline: none; }
        .control-panel input::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; background: var(--accent); border-radius: 50%; border: 1px solid #000; }

        .artwork-meta { margin-top: 2.5rem; border-left: 1px solid var(--accent); padding-left: 25px; }
        .artwork-meta h3 { font-family: 'Cinzel', serif; font-size: 1.8rem; letter-spacing: 5px; margin-bottom: 10px; }
        .artwork-meta p { color: #555; font-style: italic; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="grain"></div>
    <div class="spotlight" id="spotlight"></div>
    <div id="gate"><button class="enter-btn" id="enter-btn">UNLOCK THE SILENCE</button></div>

    <div id="archive-content">
        <header>
            <h1 class="main-title">WEESUNGSHIN</h1>
            <div class="philosophy-box">
                <b>수백수천 장의 출력 끝에 마침내 도달한 단 하나의 숨결.</b><br>
                본 아카이브의 작품은 작가 위성신이 승인한 오직 단 하나의 실물 캔버스로 완성되었음을 확약하며, 작가의 인장과 서명을 통해 그 희소성을 보호합니다.
                <span class="accent-line">AUTHENTICITY & EXCLUSIVITY GUARANTEED</span>
            </div>
        </header>

        <main class="gallery-grid" id="main-gallery"></main>
        <footer style="padding: 20vh; text-align: center; opacity: 0.1; font-family: 'Cinzel'; letter-spacing: 12px; font-size: 0.8rem;">&copy; 2026 WEESUNGSHIN.</footer>
    </div>

    <script>
        const artworks = [
            { id: 1, title: "Resonance of Void #01", img: "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?q=80&w=1200", isSold: true, collector: "P.R.G (PARIS)", temp: 3200, int: 0.65 },
            { id: 2, title: "Celestial Fragments", img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200", isSold: false, collector: "", temp: 5200, int: 0.45 }
        ];

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            if(params.get('access') === 'exclusive') {
                document.getElementById('enter-btn').onclick = () => {
                    document.getElementById('gate').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('gate').style.display = 'none';
                        document.getElementById('archive-content').style.display = 'block';
                        setTimeout(() => document.getElementById('archive-content').style.opacity = '1', 100);
                    }, 1200);
                    render();
                };
            }
        };

        function render() {
            const container = document.getElementById('main-gallery');
            artworks.forEach(art => {
                const el = document.createElement('div');
                el.className = `canvas-container`;
                el.innerHTML = `
                    <div class="canvas-wrap" id="wrap-${art.id}" onmousemove="handle3D(event, ${art.id})" onmouseleave="reset3D(${art.id})">
                        <div class="canvas-image-layer">
                            <img src="${art.img}" id="img-${art.id}" class="main-img" style="filter: sepia(${(6500-art.temp)/5000}) brightness(0.92)">
                            <div class="texture-layer" id="tex-${art.id}" style="opacity:${art.int}"></div>
                            <div class="curated-overlay ${art.isSold ? 'is-sold' : ''}"><div class="pressed-seal">CURATED BY<br>${art.collector || 'PRIVATE'}</div></div>
                        </div>
                    </div>
                    <div class="control-panel">
                        <label>Lighting Temperature <span id="l-t-${art.id}">${art.temp}K</span></label>
                        <input type="range" min="2000" max="8500" value="${art.temp}" oninput="adj(${art.id},'t',this.value)">
                        <label>Texture Tactility <span id="l-i-${art.id}">${Math.round(art.int*100)}%</span></label>
                        <input type="range" min="0" max="100" value="${art.int*100}" oninput="adj(${art.id},'i',this.value/100)">
                    </div>
                    <div class="artwork-meta"><h3>${art.title}</h3><p>${art.isSold ? 'Collected in Private Salon' : 'Single Masterpiece Available'}</p></div>
                `;
                container.appendChild(el);
            });
        }

        // 3D 액자 인터랙션
        function handle3D(e, id) {
            const wrap = document.getElementById(`wrap-${id}`);
            const rect = wrap.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            const rotateX = (rect.height / 2 - y) / 10, rotateY = (x - rect.width / 2) / 10;
            wrap.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
        }

        function reset3D(id) { document.getElementById(`wrap-${id}`).style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`; }

        function adj(id, type, val) {
            if(type === 't') {
                document.getElementById(`img-${id}`).style.filter = `sepia(${(6500-val)/5000}) brightness(0.92)`;
                document.getElementById(`l-t-${id}`).innerText = val + 'K';
            } else {
                document.getElementById(`tex-${id}`).style.opacity = val;
                document.getElementById(`l-i-${id}`).innerText = Math.round(val*100) + '%';
            }
        }

        document.addEventListener('mousemove', e => {
            document.getElementById('spotlight').style.setProperty('--x', e.clientX + 'px');
            document.getElementById('spotlight').style.setProperty('--y', e.clientY + 'px');
        });
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
